spring.application.name=users-authentication
server.port=8081

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:campusstudy_users_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate y Consola H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Propiedades custom con prefijo de aplicación
app.jwt.secret=9a8f7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a
app.jwt.expiration=86400000