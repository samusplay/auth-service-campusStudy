spring.application.name=users-authentication
server.port=8081

# Base de datos PostgreSQL
# En Docker toma las variables del compose; desde IntelliJ usa localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campus123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Propiedades custom de la aplicacion
# Sin valor por defecto: si falta APP_JWT_SECRET, el servicio no arranca
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Salud: /health para el pipeline y Kubernetes
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health