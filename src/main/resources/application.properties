spring.application.name=users-authentication
server.port=8081

# Base de datos PostgreSQL
# En Docker toma las variables del compose; desde IntelliJ usa localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campus123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Propiedades custom de la aplicacion
app.jwt.secret=${APP_JWT_SECRET:9a8f7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}