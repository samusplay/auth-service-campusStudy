services:
  postgres:
    image: postgres:16
    container_name: campusstudy-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusstudy_users
    ports:
      - "5433:5432"
    volumes:
      - campusstudy_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusstudy_users"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusstudy_users_data:
